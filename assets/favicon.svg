<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Calculator body -->
  <rect x="12" y="20" width="40" height="36" rx="6" fill="#e85d04"/>
  <!-- Screen -->
  <rect x="17" y="24" width="30" height="11" rx="2.5" fill="#fff"/>
  <!-- Division sign on screen -->
  <rect x="27.5" y="28.6" width="9" height="1.8" rx="0.9" fill="#e85d04"/>
  <circle cx="30" cy="26.6" r="1.1" fill="#e85d04"/>
  <circle cx="34" cy="32.6" r="1.1" fill="#e85d04"/>
  <!-- Buttons -->
  <rect x="17" y="39" width="8" height="6" rx="1.6" fill="#fff" opacity="0.95"/>
  <rect x="28" y="39" width="8" height="6" rx="1.6" fill="#fff" opacity="0.8"/>
  <rect x="39" y="39" width="8" height="6" rx="1.6" fill="#fff" opacity="0.65"/>
  <rect x="17" y="48" width="8" height="6" rx="1.6" fill="#fff" opacity="0.65"/>
  <rect x="28" y="48" width="19" height="6" rx="1.6" fill="#fff" opacity="0.8"/>
  <!-- Two smileys hugging -->
  <g transform="rotate(-10 24 16)">
    <circle cx="24" cy="16" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="21" cy="14.5" r="1.2" fill="#78350f"/>
    <circle cx="27" cy="14.5" r="1.2" fill="#78350f"/>
    <path d="M20.8 18.2 Q24 21.2 27.2 18.2" fill="none" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g transform="rotate(10 40 16)">
    <circle cx="40" cy="16" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="37" cy="14.5" r="1.2" fill="#78350f"/>
    <circle cx="43" cy="14.5" r="1.2" fill="#78350f"/>
    <path d="M36.8 18.2 Q40 21.2 43.2 18.2" fill="none" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- Hugging arms -->
  <rect x="27" y="19" width="10" height="5.5" rx="2.75" fill="#d97706"/>
</svg>
